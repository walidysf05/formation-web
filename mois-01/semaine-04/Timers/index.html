<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decompte</title>
    <script>
      function decompte(n) {
        console.log(n);
        if (n === 0) {
          return;
        }
        setTimeout(() => {
          decompte(n - 1);
        }, 1000);
      }

      decompte(5);
    </script>
  </head>
  <body></body>
</html>
