<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <script type="module" src="app.js"></script>
</head>

<body>

    <section class="container pt-5" id="todolist">
        <form class="row g-2 pb-4" id="task-form">
            <div class="col-12 col-md">
                <input required class="form-control" type="text" placeholder="Ajouter une tâche..." name="title" aria-label="Titre de la tâche">
            </div>
            <div class="col-6 col-md-auto">
                <select class="form-select" name="priority" aria-label="Priorité">
                    <option value="low">Priorité basse</option>
                    <option value="normal" selected>Priorité normale</option>
                    <option value="high">Priorité haute</option>
                    <option value="urgent">Priorité urgente</option>
                </select>
            </div>
            <div class="col-6 col-md-auto">
                <button type="submit" class="btn btn-primary w-100">Ajouter</button>
            </div>
        </form>

        
        <div id="message" role="alert"></div>

        <main>
            <div class="btn-group mb-4" role="group" aria-label="Filtrer les tâches">
                <button type="button" class="btn btn-outline-primary active" data-filter="all">Toutes</button>
                <button type="button" class="btn btn-outline-primary" data-filter="todo">À faire</button>
                <button type="button" class="btn btn-outline-primary" data-filter="done">Faites</button>
            </div>

            <ul class="list-group"></ul>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <span id="counter" class="text-muted" aria-live="polite"></span>
                <button type="button" id="clear-done" class="btn btn-outline-danger btn-sm">
                    Supprimer les tâches terminées
                </button>
            </div>
        </main>
    </section>

</body>
</html>
