<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <script>
        const x = Number(prompt('Enter first number'));
        const oper = prompt('Choose an operation (+, -, *, /, %)');
        const y = Number(prompt('Enter second number'));
        
        } else if (oper === '+') {
            console.log(`${x} + ${y} = ${x + y}`);
        } else if (oper === '-') {
            console.log(`${x} - ${y} = ${x - y}`);
        } else if (oper === '*') {
            console.log(`${x} * ${y} = ${x * y}`);
        } else if (oper === '/') {
            if (y !== 0) {
                console.log(`${x} / ${y} = ${x / y}`);
            } else {
                console.log('Cannot divide by 0');
            }
        } else if (oper === '%') {
            if (y !== 0) {
                console.log(`${x} % ${y} = ${x % y}`);
            } else {
                console.log('Cannot divide by 0');
            }
        } else {
            console.log(`Invalid operation: ${oper}`);   
        }
    </script>
</body>
</html>
