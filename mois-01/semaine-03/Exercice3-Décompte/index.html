<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Backward</title>
</head>
<script>

    let number = Number(prompt('Enter a number between 0 and 10'));
    if ( number > 10 || number < 0 ){
        console.log(' the number you entred is not between 0 and 10');
    } else {
       for(let i = number; i >=0 ; i--){
            console.log(i);
       }
    }

</script>

</body>
</html>
