    <title>Recommandation System </title>
    <script>
        const Year = 2026
        const birthDay = prompt('Enter the year of your birth');
        const age = Year - birthDay
        switch(true) {
            case age <= 13 :
                console.log('Lilo & Stitch');
                break
            case age < 18 :
                console.log('Matrix');
                break
            default :
                console.log('Evil Dead');
                break 
        }
    </script>
