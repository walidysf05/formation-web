<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systeme de recommandation</title>
    <script>
        const Année = 2026
        const dateDeNaissance = prompt('Entrez votre date de naissance')
        const age = Année - dateDeNaissance

        switch(true) {
            case age <= 13 :
                console.log('Lilo & Stitch')
                break
            
            case age < 18 :
                console.log('Matrix')
                break

            default :
                console.log('Evil Dead')
                break 
        }
        
    </script>
</head>

</body>
</html>
