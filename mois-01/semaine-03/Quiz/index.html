<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h1>Quiz : la météo</h1>

      <div id="barre">
        <div id="progres"></div>
      </div>

      <div id="logo"></div>
      <h2 id="question"></h2>

      <div id="boutons"></div>
      <button id="rejouer" onclick="rejouer()">Rejouer</button>
    </main>

    <script>
      const questions = [
        {
          texte: "Quel temps représente cette icône ?",
          logo: `<svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`,
          choix: ["Du soleil", "De la neige", "Du vent"],
          bonne: 0,
        },
        {
          texte: "Quel temps représente cette icône ?",
          logo: `<svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>`,
          choix: ["De la neige", "De la pluie", "Du brouillard"],
          bonne: 1,
        },
        {
          texte: "Quel temps représente cette icône ?",
          logo: `<svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 20-1.25-2.5L6 18"/><path d="M10 4 8.75 6.5 6 6"/><path d="m14 20 1.25-2.5L18 18"/><path d="m14 4 1.25 2.5L18 6"/><path d="m17 21-3-6h-4"/><path d="m17 3-3 6 1.5 3"/><path d="M2 12h6.5L10 9"/><path d="m20 10-1.5 2 1.5 2"/><path d="M22 12h-6.5L14 15"/><path d="m4 10 1.5 2L4 14"/><path d="m7 21 3-6-1.5-3"/><path d="m7 3 3 6h4"/></svg>`,
          choix: ["Du vent", "Un orage", "De la neige"],
          bonne: 2,
        },
        {
          texte: "Quel temps représente cette icône ?",
          logo: `<svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg>`,
          choix: ["Un orage", "Du vent", "De la neige"],
          bonne: 1,
        },
        {
          texte: "Quel temps représente cette icône ?",
          logo: `<svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"/><path d="m13 12-3 5h4l-3 5"/></svg>`,
          choix: ["Un orage", "Du brouillard", "De la pluie"],
          bonne: 0,
        },
      ];

      const DELAI = 900;

      let numero = 0;
      let score = 0;
      let bloque = false;

      const zoneBoutons = document.getElementById("boutons");
      const progres = document.getElementById("progres");
      const questionEl = document.getElementById("question");
      const logoEl = document.getElementById("logo");

      function afficher() {
        const q = questions[numero];
        questionEl.textContent = q.texte;
        logoEl.innerHTML = q.logo;
        progres.style.width = (numero / questions.length) * 100 + "%";

        zoneBoutons.innerHTML = "";
        for (let i = 0; i < q.choix.length; i++) {
          const bouton = document.createElement("button");
          bouton.textContent = q.choix[i];
          bouton.onclick = function () {
            repondre(i);
          };
          zoneBoutons.appendChild(bouton);
        }
      }

      function repondre(selectedAnswer) {
        if (bloque) {
          return;
        }
        bloque = true;

        const rightAnswer = questions[numero].bonne;
        const boutons = zoneBoutons.children;

        if (selectedAnswer === rightAnswer) {
          score++;
          boutons[selectedAnswer].classList.add("bon");
        } else {
          boutons[selectedAnswer].classList.add("mauvais");
          boutons[rightAnswer].classList.add("bon");
        }

        setTimeout(suivant, DELAI);
      }

      function suivant() {
        numero++;
        bloque = false;

        if (numero < questions.length) {
          afficher();
        } else {
          progres.style.width = "100%";
          questionEl.textContent =
            "Ton score : " + score + " / " + questions.length;
          logoEl.innerHTML = "";
          zoneBoutons.innerHTML = "";
          document.getElementById("rejouer").style.display = "block";
        }
      }

      function rejouer() {
        numero = 0;
        score = 0;
        document.getElementById("rejouer").style.display = "none";
        afficher();
      }

      afficher();
    </script>
  </body>
</html>
