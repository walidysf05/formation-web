<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The average</title>
    <script>
      const students = [
        {
          name: "John",
          grades: [1, 20, 18, 19, 12],
        },
        {
          name: "Jane",
          grades: [17, 18, 20, 13, 15],
        },
        {
          name: "Sophie",
          grades: [17, 12, 14, 15, 13],
        },
        {
          name: "Marc",
          grades: [2, 3, 5, 8, 9],
        },
        {
          name: "Manon",
          grades: [18, 17, 18, 19, 12],
        },
      ];

      const average = (grades) => {
        let sum = 0;
        for (let grade of grades) {
          sum = sum + grade;
        }
        return sum / grades.length;
      };

      for (let student of students) {
        student.average = average(student.grades);
      }

      students.sort((a, b) => b.average - a.average);

      console.log("Top 3 of students :");

      for (let i = 0; i < 3; i++) {
      console.log(i + 1, students[i].name, students[i].average);
      }
    </script>
  </head>
  <body></body>
</html>
