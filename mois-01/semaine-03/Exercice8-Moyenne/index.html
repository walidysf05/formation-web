<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The average</title>
    <script>
      const students = [
        {
          name: "John",
          notes: [1, 20, 18, 19, 12],
        },
        {
          name: "Jane",
          notes: [17, 18, 20, 13, 15],
        },
        {
          name: "Sophie",
          notes: [17, 12, 14, 15, 13],
        },
        {
          name: "Marc",
          notes: [2, 3, 5, 8, 9],
        },
        {
          name: "Manon",
          notes: [18, 17, 18, 19, 12],
        },
      ];

      const average = (notes) => {
        let sum = 0;
        for (let note of notes) {
          sum = sum + note;
        }
        return sum / notes.length;
      };

      for (let student of students) {
        student.average = average(student.notes);
      }

      students.sort((a, b) => b.average - a.average);

      console.log("Top 3 of students :");

      for (let i = 0; i < 3; i++) {
      console.log(i + 1, students[i].name, students[i].average);
      }
    </script>
  </head>
  <body></body>
</html>
