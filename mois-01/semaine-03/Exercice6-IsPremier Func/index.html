<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IsPremier</title>
    <script>
      const isPremier = (n) => {
        if (n < 2) {
          return false;
        }

        let i = n - 1;
        while (i > 1) {
          if (n % i === 0) {
            return false;
          }
          i--;
        }
        return true;
      };
      console.log("6", isPremier(6));
      console.log("11", isPremier(11));
      console.log("22", isPremier(22));
    </script>
  </head>
  <body></body>
</html>
